services:
  postgres:
    image: postgres:15
    container_name: airbnb-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: local-airbnb-dev-secret
      AIRFLOW_CONN_POSTGRES: postgresql://postgres:postgres@postgres:5432/airbnb_census
      AIRFLOW_VAR_AIRFLOW_DATA_PATH: /opt/airflow/data
      AIRFLOW_VAR_RUN_INITIAL_LOAD: "true"
      AIRFLOW_VAR_BRONZE_INIT_SQL_PATH: /opt/airflow/sql/init_bronze_schema.sql
      AIRFLOW_VAR_DBT_RUN_MODE: local
      AIRFLOW_VAR_DBT_PROJECT_DIR: /opt/airflow/dbt
      AIRFLOW_VAR_DBT_PROFILES_DIR: /opt/airflow/.dbt
      BRONZE_INIT_SQL_PATH: /opt/airflow/sql/init_bronze_schema.sql
      DBT_RUN_MODE: local
      DBT_PROJECT_DIR: /opt/airflow/dbt
      DBT_PROFILES_DIR: /opt/airflow/.dbt
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
      - ./docker/dbt/profiles.yml:/opt/airflow/.dbt/profiles.yml
      - airflow-logs:/opt/airflow/logs
    user: "${AIRFLOW_UID:-50000}:0"
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --firstname Admin --lastname User
      --role Admin --email admin@example.com --password admin || true"

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: airbnb-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: airbnb-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    user: "${AIRFLOW_UID:-50000}:0"
    command: scheduler

volumes:
  postgres-data:
  airflow-logs:
